[project]
name = "promethee"
version = "0.1.0"
description = "Prométhée: local voice assistant (wake word, STT, LLM with MCP tools, TTS)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "faster-whisper>=1.1",
    "piper-tts>=1.3",
    "openwakeword>=0.6",
    "ollama>=0.5",
    "mcp>=1.20",
    "sounddevice>=0.5",
    "numpy>=1.26",
    "psutil>=6.0",
    "python-dotenv>=1.0",
    "ddgs>=9.0",
    "httpx>=0.27",
]

[project.scripts]
promethee = "promethee.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["promethee"]
